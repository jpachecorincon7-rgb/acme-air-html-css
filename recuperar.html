<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recupera el acceso a tu cuenta de ACME AIR.">
  <title>ACME AIR — Recuperar Contraseña</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="page-wrapper" id="recuperar-page">

    
    <header class="app-header" role="banner">
      <div class="app-header__logo">
        <img src="img/icons/avion.png" alt="" class="app-header__plane">
        <div class="app-header__brand">
          <span class="app-header__name">ACME AIR</span>
          <span class="app-header__tagline">Flying to your dreams</span>
        </div>
      </div>
    </header>

    
    <main class="app-card" role="main">

      <h1 class="card-title">Recuperar Contraseña</h1>
      <hr class="card-divider">

      <form id="recuperar-form" action="crear-contrase%C3%B1a.html" novalidate>

      
        <div class="form-group">
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="Email"
            autocomplete="email"
            required
            aria-required="true"
            aria-label="Correo electrónico registrado"
          >
        </div>

       
        <p class="help-text">
          Si el e-mail se encuentra registrado se enviará un link para
          continuar con la recuperación de su contraseña.
        </p>

       
        <div class="form-group">
          <a
            href="crear-contrase%C3%B1a.html"
            class="btn-primary"
            id="btn-enviar-recuperar"
            role="button"
            aria-label="Enviar enlace de recuperación"
          >
            ENVIAR
          </a>
        </div>

      </form>

    </main>

  </div>

</body>
</html>
