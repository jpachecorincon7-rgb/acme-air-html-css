<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACME AIR - Vuelos Disponibles</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="page-wrapper">
    <header class="app-header">
      <div class="app-header__logo">
        <img src="img/icons/avion.png" alt="Logo" class="app-header__plane">
        <div class="app-header__brand">
          <span class="app-header__name">ACME AIR</span>
          <span class="app-header__tagline">Flying to your dreams</span>
        </div>
      </div>
    </header>
    <main class="app-card" style="max-width: 500px; width: 100%;">
      
     
      <div class="user-profile">
        <img src="img/icons/usuario.png" alt="User" class="user-avatar">
        <div class="user-info">
          <span class="user-name">John Doe</span>
          <a href="index.html" class="user-logout">Cerrar Sesión</a>
        </div>
      </div>
      
      <hr class="card-divider" style="margin-bottom: 20px;">
      <h1 class="card-title-center">Vuelos disponibles</h1>
      
      
      <div class="flight-search-info">
        <div>Bogotá - Barranquilla</div>
        <div>Septiembre - 29</div>
      </div>
      
      <div class="flights-list">
        
        <article class="flight-card-custom">
          <div class="flight-icon-custom">
             <img src="img/icons/despegue-del-avion.png" alt="Icono vuelo">
          </div>
          <div class="flight-times-custom">
            <div class="time">05:30 - 06:30</div>
            <div class="duration">1h 30 min</div>
          </div>
          <div class="flight-price-custom">
            <div class="flight-num">VAA025</div>
            <div class="price-val"><span>COP </span>150.600</div>
          </div>
        </article>
        
        <article class="flight-card-custom">
          <div class="flight-icon-custom">
             <img src="img/icons/despegue-del-avion.png" alt="Icono vuelo">
          </div>
          <div class="flight-times-custom">
            <div class="time">10:30 - 12:05</div>
            <div class="duration">1h 30 min</div>
          </div>
          <div class="flight-price-custom">
            <div class="flight-num">VAA412</div>
            <div class="price-val"><span>COP </span>260.050</div>
          </div>
        </article>
        <article class="flight-card-custom">
          <div class="flight-icon-custom">
             <img src="img/icons/despegue-del-avion.png" alt="Icono vuelo">
          </div>
          <div class="flight-times-custom">
            <div class="time">14:15 - 15:45</div>
            <div class="duration">1h 30 min</div>
          </div>
          <div class="flight-price-custom">
            <div class="flight-num">VAA836</div>
            <div class="price-val"><span>COP </span>150.600</div>
          </div>
        </article>
      </div>
      
      <a href="menu.html" class="btn-volver-block">VOLVER</a>
    </main>
  </div>
</body>
</html>
