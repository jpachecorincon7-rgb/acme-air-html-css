<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACME AIR - Buscar Vuelos</title>
 <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header>
    <img src="img/avion.png" alt="Logo ACME AIR" class="logo">
    <div>
      <h1>ACME AIR</h1>
      <p>Flying to your dreams</p>
    </div>
  </header>
  <section>
    <div>
      <img src="img/usuario.png" alt="Usuario" >
      <p>John Doe</p>
      <a href="login.html">Cerrar Sesión</a>
    </div>
  </section>
  <main>
    <h2>Busqueda de vuelos</h2>
    <form action="vuelos.html" method="post">
      <div>
        <input type="checkbox" id="ida" name="ida">
        <label for="ida">Solo ida</label>
      </div>
      <label for="origen">Origen</label>
      <input type="text" id="origen" name="origen" required>
      <label for="destino">Destino</label>
      <input type="text" id="destino" name="destino" required>
      <label for="salida">Fecha de salida</label>
      <input type="date" id="salida" name="salida" placeholder="dd/mm/aaaa" required>
      <label for="regreso">Fecha de regreso</label>
      <input type="date" id="regreso" name="regreso" placeholder="dd/mm/aaaa">
      <button type="submit">BUSCAR</button>
    </form>
  </main>
</body>
</html>
