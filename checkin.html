<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Realiza tu Check-In en línea con ACME AIR y obtén tu pase de abordar en minutos.">
  <meta name="theme-color" content="#d13cff">
  <title>ACME AIR — Check-In</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Decoradores de fondo -->
  <div class="bg-blob bg-blob-1" aria-hidden="true"></div>
  <div class="bg-blob bg-blob-2" aria-hidden="true"></div>

  <div class="inner-page" id="checkin-page">

    <!-- ======== HEADER ======== -->
    <header class="inner-header" role="banner">
      <a href="menu.html" class="btn-back" aria-label="Volver al menú principal">←</a>
      <h1 class="inner-header__title">Check-In</h1>
      <div class="inner-header__right">
        <a href="index.html" class="btn btn-outline-white" aria-label="Cerrar sesión">🚪 Salir</a>
      </div>
    </header>

    <!-- ======== HERO ======== -->
    <div class="page-hero" aria-hidden="true">
      <span class="page-hero__icon" role="img" aria-label="Equipaje">🧳</span>
      <p class="page-hero__title">Prepara tu viaje</p>
      <p class="page-hero__sub">Realiza tu check-in y obtén tu pase de abordar</p>
    </div>

    <!-- ======== CONTENIDO ======== -->
    <main class="inner-content" id="checkin-content">

      <section class="inner-card" aria-labelledby="checkin-heading">

        <h2 class="inner-card__title" id="checkin-heading">Ingresa tus datos</h2>
        <p class="inner-card__subtitle">Necesitas tu código de reserva (PNR) y apellido</p>

        <form id="checkin-form" novalidate>

          <!-- Código de Reserva (PNR) -->
          <div class="form-group">
            <label for="pnr" class="form-label">
              Código de Reserva (PNR) <span class="required" aria-hidden="true">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">🔢</span>
              <input
                type="text"
                id="pnr"
                name="pnr"
                class="form-input"
                placeholder="Ej: ABCDEF"
                autocomplete="off"
                required
                aria-required="true"
                aria-label="Código de Reserva PNR de 6 caracteres"
                maxlength="6"
                pattern="[A-Za-z0-9]{6}"
                style="text-transform: uppercase;"
              >
            </div>
            <span class="form-hint">Es un código de 6 letras y números.</span>
          </div>

          <!-- Apellido -->
          <div class="form-group" style="margin-top: var(--sp-3);">
            <label for="apellido" class="form-label">
              Apellido <span class="required" aria-hidden="true">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">👤</span>
              <input
                type="text"
                id="apellido"
                name="apellido"
                class="form-input"
                placeholder="Ej: García"
                autocomplete="family-name"
                required
                aria-required="true"
                aria-label="Apellido del pasajero"
              >
            </div>
          </div>
          
          <!-- Confirmación de carga peligrosa -->
          <div style="margin-bottom: var(--sp-4); margin-top: var(--sp-4);">
            <label class="form-check" for="carga-peligrosa">
              <input type="checkbox" id="carga-peligrosa" name="carga-peligrosa" required aria-label="Confirmo que no llevo artículos prohibidos">
              <span class="form-check__label" style="font-size: var(--tx-xs);">
                Confirmo que he leído la lista de artículos prohibidos y no llevo materiales peligrosos en mi equipaje.
              </span>
            </label>
          </div>

          <!-- Botón Buscar -->
          <div style="margin-top: var(--sp-6);">
            <a
              href="menu.html"
              class="btn btn-primary"
              id="btn-realizar-checkin"
              role="button"
              aria-label="Procesar Check-in y volver al menú"
            >
              ✅&nbsp; Obtener Pase de Abordar
            </a>
          </div>

        </form>

      </section>

    </main>

  </div>

</body>
</html>
