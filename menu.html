<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - ACME AIR</title>
    <!-- Aquí conectarás tu archivo CSS más adelante -->
</head>
<body>

    <main class="menu-container">
        <!-- Tarjeta principal de la interfaz móvil -->
        <section class="menu-card">
            
            <!-- Banner superior con gradiente, logo y nombre de la aerolínea -->
            <header class="menu-header">
                <div class="logo-wrapper">
                    <img src="logo-white.png" alt="Logo ACME AIR" class="company-logo">
                    <div class="brand-text">
                        <span class="brand-name">ACME AIR</span>
                        <span class="brand-slogan">Flying to your dreams</span>
                    </div>
                </div>
            </header>

            <!-- Contenido de bienvenida y acciones -->
            <div class="menu-content">
                
                <!-- Encabezado de usuario -->
                <div class="user-greeting">
                    <h1>¡Hola John Doe!</h1>
                    <h2>¿Que quieres hacer?</h2>
                    <a href="#" class="btn-logout">Cerrar Sesión</a>
                </div>

                <!-- Lista de tarjetas visuales/opciones -->
                <nav class="menu-navigation">
                    
                    <!-- Opción 1: Buscar vuelos -->
                    <a href="#" class="menu-item-card">
                        <div class="card-left">
                            <img src="icon-vuelos.png" alt="" class="card-icon" aria-hidden="true">
                            <span class="card-title">Buscar vuelos</span>
                        </div>
                        <span class="card-arrow" aria-hidden="true">&gt;</span>
                    </a>

                    <!-- Opción 2: Check In -->
                    <a href="#" class="menu-item-card">
                        <div class="card-left">
                            <img src="icon-checkin.png" alt="" class="card-icon" aria-hidden="true">
                            <span class="card-title">Check In</span>
                        </div>
                        <span class="card-arrow" aria-hidden="true">&gt;</span>
                    </a>

                    <!-- Opción 3: Mis Vuelos -->
                    <a href="#" class="menu-item-card">
                        <div class="card-left">
                            <img src="icon-misvuelos.png" alt="" class="card-icon" aria-hidden="true">
                            <span class="card-title">Mis Vuelos</span>
                        </div>
                        <span class="card-arrow" aria-hidden="true">&gt;</span>
                    </a>

                </nav>

            </div>

        </section>
    </main>

</body>
</html>
