<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACME AIR — Registro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="page-wrapper">
    <header class="app-header">
      <div class="app-header__logo">
        <img src="img/icons/avion.png" alt="Logo" class="app-header__plane">
        <div class="app-header__brand">
          <span class="app-header__name">ACME AIR</span>
          <span class="app-header__tagline">Flying to your dreams</span>
        </div>
      </div>
    </header>

    <main class="app-card">
      <a href="index.html" class="btn-back">← Volver</a>
      <h1 class="card-title">Registro</h1>
      <hr class="card-divider">

      <form action="crear-contraseña.html" method="get">
        <div class="form-group">
          <input type="text" name="nombre" class="form-input" placeholder="Nombre completo" required>
        </div>
        <div class="form-group">
          <input type="text" name="identificacion" class="form-input" placeholder="Identificación" required>
        </div>
        <div class="form-group">
          <input type="email" name="email" class="form-input" placeholder="E-mail" required>
        </div>
        <div class="form-group">
          <input type="tel" name="telefono" class="form-input" placeholder="Teléfono" required>
        </div>
        <div class="form-group select-wrapper">
          <select name="ciudad" class="form-select" required>
            <option value="" disabled selected>Ciudad</option>
            <option value="bogota">Bogotá</option>
            <option value="medellin">Medellín</option>
            <option value="cali">Cali</option>
          </select>
        </div>
        <div class="form-group">
          <a href="crear-contraseña.html" class="btn-primary" role="button">GUARDAR</a>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
